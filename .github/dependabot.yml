version: 2
updates:
  # Keep GitHub Actions versions up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep Cargo dependencies up to date.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group minor/patch bumps into a single PR to reduce noise.
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
